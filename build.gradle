plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.ftb.dev/releases/' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Needed by the FTB mods in the development run directory, but not by this mod.
	modLocalRuntime 'dev.architectury:architectury-fabric:9.2.14'
	modCompileOnly 'maven.modrinth:open-parties-and-claims:vhlyXP4C'
	modCompileOnly 'dev.ftb.mods:ftb-quests-fabric:2001.4.22'
	modCompileOnly 'dev.ftb.mods:ftb-library-fabric:2001.2.13'
	implementation 'com.electronwill.night-config:toml:3.9.0'
	include 'com.electronwill.night-config:toml:3.9.0'
	implementation 'com.electronwill.night-config:core:3.9.0'
	include 'com.electronwill.night-config:core:3.9.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

loom {
	runs {
		client {
			// Keep the same offline player UUID across development launches so per-player saves persist.
			programArgs "--username", "Player1"
		}
        structureBenchmarks {
            inherit client
            runDir "run-structure-benchmarks"
            configName = "Minecraft (Automated Structure Benchmarks)"
        }
		clientClean {
			inherit client
			runDir "run-clean"
			configName = "Minecraft Client (Clean)"
		}
		playerOne {
			client()
			runDir 'run-multiplayer/player1'
			configName = 'Multiplayer Test - Player1'
			programArgs '--username', 'Player1', '--server', '127.0.0.1', '--port', '25565'
		}
		playerTwo {
			client()
			runDir 'run-multiplayer/player2'
			configName = 'Multiplayer Test - Player2'
			programArgs '--username', 'Player2', '--server', '127.0.0.1', '--port', '25565'
		}
		multiplayerServer {
			server()
			runDir 'run-multiplayer/server'
			configName = 'Multiplayer Test - Local Server'
			programArgs 'nogui'
		}
	}
}

// Seed isolated test folders once; subsequent launches preserve edits and worlds.
tasks.register('prepareMultiplayerTest') {
	doLast {
		['player1', 'player2', 'server'].each { name ->
			def target = file("run-multiplayer/${name}")
			target.mkdirs()
			copy {
				from 'run/config'
				into new File(target, 'config')
				eachFile { entry ->
					if (new File(target, "config/${entry.path}").exists()) entry.exclude()
				}
			}
			fileTree('run/mods').matching { include '*.jar' }.each { mod ->
				boolean clientOnly = false
				new java.util.zip.ZipFile(mod).withCloseable { zip ->
					def metadata = zip.getEntry('fabric.mod.json')
					if (metadata != null) zip.getInputStream(metadata).withCloseable { stream ->
						clientOnly = new groovy.json.JsonSlurper().parse(stream).environment == 'client'
					}
				}
				def destination = new File(target, "mods/${mod.name}")
				if (!(name == 'server' && clientOnly) && !destination.exists()) {
					destination.parentFile.mkdirs()
					java.nio.file.Files.copy(mod.toPath(), destination.toPath())
				}
			}
		}
		def properties = file('run-multiplayer/server/server.properties')
		if (!properties.exists()) properties.text = '''server-ip=127.0.0.1
server-port=25565
online-mode=false
gamemode=creative
difficulty=normal
spawn-protection=0
motd=Explorer's Compass local multiplayer test
'''
		def eula = file('run-multiplayer/server/eula.txt')
		if (!eula.exists()) eula.text = '# Read https://aka.ms/MinecraftEULA before changing this to true\neula=false\n'
	}
}

['runPlayerOne', 'runPlayerTwo', 'runMultiplayerServer'].each { taskName ->
	tasks.named(taskName).configure { dependsOn 'prepareMultiplayerTest' }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

def java17Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(Test).configureEach {
	javaLauncher = java17Launcher
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = java17Launcher
}

test {
	useJUnitPlatform()
	workingDir layout.buildDirectory.dir('test-run')
	doFirst { workingDir.mkdirs() }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
